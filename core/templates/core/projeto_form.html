{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<section class="card">
    <div class="page-header">
        <h2>{{ titulo }}</h2>
        <a href="{% url 'core:projeto_list' %}" class="btn btn-secondary">← Voltar para a lista</a>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {% for error in field.errors %}
                    <span class="error">{{ error }}</span>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">{{ botao }}</button>
    </form>
</section>
{% endblock %}
